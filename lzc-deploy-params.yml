params:
  - id: admin_username
    type: string
    name: Admin username
    description: "Username of the administrator account created on first start."
    default_value: "admin"
    optional: false

  - id: admin_password
    type: secret
    name: Admin password
    description: "Password of the administrator account. Random by default; the weak PiGallery2 default (admin/admin) is never created."
    default_value: "$random(len=20)"
    optional: false

locales:
  zh:
    admin_username:
      name: 管理员用户名
      description: 首次启动时创建的管理员账号用户名。
    admin_password:
      name: 管理员密码
      description: 管理员账号的密码。默认随机生成；PiGallery2 默认的 admin/admin 弱口令账号不会被创建。
